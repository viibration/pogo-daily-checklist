<title>Daily Checklist</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1620" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daily Checklist" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/favicon.png" />
<style>
  :root {
    --bg: #0e1620;
    --panel: #16223a;
    --panel-2: #1c2c4a;
    --line: #2a3b52;
    --text: #f2f6ff;
    --text-dim: #9fb0d1;
    --text-faint: #62729a;
    --accent: #3fa6ff;
    --good: #4fd8a4;
    --bad: #ff7a68;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(rgba(14, 22, 32, 0.7), rgba(14, 22, 32, 0.7)),
      url('background.jpg') center/cover no-repeat var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    display: flex;
    justify-content: center;
    padding: 32px 16px 56px;
  }

  .page { width: 100%; max-width: 560px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .panel + .panel { margin-top: 14px; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .header h1 {
    margin: 0;
    font-size: 20px;
  }
  .header .date {
    font-size: 13px;
    color: var(--text-faint);
  }

  .header-with-back {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    font: inherit;
    font-size: 19px;
    line-height: 1;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
  }
  .back-btn:hover { color: var(--accent); border-color: var(--accent); }
  .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .progress-track {
    height: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.2s ease;
  }
  .progress-fill.complete { background: var(--good); }
  .progress-label {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dim);
    text-align: right;
  }
  .progress-label.complete { color: var(--good); }

  .items { display: flex; flex-direction: column; gap: 8px; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .item:hover { border-color: var(--accent); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .item .box {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: 2px solid var(--text-faint);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item .box svg {
    width: 15px;
    height: 15px;
    opacity: 0;
  }
  .item.done .box {
    background: var(--good);
    border-color: var(--good);
  }
  .item.done .box svg { opacity: 1; }

  .item .label {
    flex: 1;
    font-size: 17px;
  }
  .item.done .label {
    color: var(--text-faint);
    text-decoration: line-through;
  }

  .reset-btn {
    width: 100%;
    margin-top: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-faint);
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--bad); border-color: var(--bad); }
  .reset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .accounts { display: flex; flex-direction: column; gap: 10px; }

  .account-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    user-select: none;
  }
  .account-card:hover { border-color: var(--accent); }
  .account-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .account-card .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .account-card .name {
    font-size: 17px;
    font-weight: 700;
  }
  .account-card .count {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .account-card .count.complete { color: var(--good); }

  .account-card .progress-track { height: 6px; }

  .task-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .task-row:hover { border-color: var(--accent); }
  .task-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .task-row .label { flex: 1; font-size: 17px; }

  .task-row .badge {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .task-row .badge.complete { color: var(--good); border-color: var(--good); }
  .task-row .badge.partial { color: var(--accent); border-color: var(--accent); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 16, 0.7);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  @media (min-height: 560px) {
    .modal-backdrop { align-items: center; }
  }

  .modal-panel {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-header .modal-title {
    font-size: 18px;
    font-weight: 700;
  }
  .modal-close {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    font: inherit;
    font-size: 19px;
    line-height: 1;
    color: var(--text-faint);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--bad); border-color: var(--bad); }
  .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .check-all-btn {
    width: 100%;
    margin-bottom: 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 9px;
    cursor: pointer;
  }
  .check-all-btn:hover { border-color: var(--accent); }
  .check-all-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .modal-accounts { display: flex; flex-direction: column; gap: 8px; }

  .modal-account-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .modal-account-row:hover { border-color: var(--accent); }
  .modal-account-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .modal-account-row .box {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: 2px solid var(--text-faint);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-account-row .box svg {
    width: 15px;
    height: 15px;
    opacity: 0;
  }
  .modal-account-row.done .box {
    background: var(--good);
    border-color: var(--good);
  }
  .modal-account-row.done .box svg { opacity: 1; }

  .modal-account-row .name { flex: 1; font-size: 16px; }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    font: inherit;
    font-size: 16px;
    line-height: 1;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .sync-section { margin-bottom: 16px; }
  .sync-section:last-child { margin-bottom: 0; }
  .sync-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .sync-textarea {
    width: 100%;
    font: inherit;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
    word-break: break-all;
  }
  .sync-textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .sync-boxes {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  .sync-box {
    width: 46px;
    min-width: 0;
    font: inherit;
    font-size: 14px;
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 4px;
  }
  .sync-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sync-box[readonly] { color: var(--text-dim); }
  .sync-dash { color: var(--text-faint); font-weight: 700; flex-shrink: 0; }

  .sync-action-btn {
    width: 100%;
    margin-top: 8px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
  }
  .sync-action-btn:hover { border-color: var(--accent); }
  .sync-action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sync-action-btn.copied { color: var(--good); border-color: var(--good); }

  [hidden] { display: none !important; }
</style>

<div class="page">
  <div id="view-dashboard">
    <div class="panel">
      <div class="header">
        <h1>Daily Checklist</h1>
        <div class="header-right">
          <span class="date" id="dashboard-date-label"></span>
          <button class="icon-btn" id="auth-btn" type="button" aria-label="Sign in to sync automatically">&#128100;</button>
          <button class="icon-btn" id="sync-btn" type="button" aria-label="Sync devices">&#8645;</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="accounts" id="accounts"></div>
    </div>
    <div class="panel">
      <button class="check-all-btn" id="bulk-open-btn" type="button">Check all tasks for account(s)&hellip;</button>
      <div class="items" id="master-tasks"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <button class="modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <button class="check-all-btn" id="modal-check-all" type="button">Check all</button>
      <div class="modal-accounts" id="modal-accounts"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="bulk-modal-backdrop" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">Check all tasks</span>
        <button class="modal-close" id="bulk-modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <button class="check-all-btn" id="bulk-select-all-btn" type="button">Select all accounts</button>
      <div class="modal-accounts" id="bulk-accounts"></div>
      <button class="sync-action-btn" id="bulk-apply-btn" type="button">Mark all tasks done for selected</button>
      <button class="reset-btn" id="bulk-uncheck-btn" type="button">Mark all tasks not done for selected</button>
    </div>
  </div>

  <div class="modal-backdrop" id="sync-modal-backdrop" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <span class="modal-title">Sync devices</span>
        <button class="modal-close" id="sync-modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="sync-section">
        <div class="sync-label">This device's code &mdash; copy it, then paste into your other device</div>
        <div class="sync-boxes" id="sync-export-boxes"></div>
        <button class="sync-action-btn" id="sync-copy-btn" type="button">Copy code</button>
      </div>
      <div class="sync-section">
        <div class="sync-label">Paste a code from your other device</div>
        <div class="sync-boxes" id="sync-import-boxes"></div>
        <button class="sync-action-btn" id="sync-paste-btn" type="button">Paste code</button>
        <button class="sync-action-btn" id="sync-apply-btn" type="button">Apply &amp; overwrite this device</button>
      </div>
    </div>
  </div>

  <div id="view-checklist" hidden>
    <div class="panel">
      <div class="header">
        <div class="header-with-back">
          <button class="back-btn" id="back-btn" type="button" aria-label="Back to dashboard">&larr;</button>
          <h1 id="account-name-label"></h1>
        </div>
        <span class="date" id="date-label"></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <div class="panel">
      <button class="check-all-btn" id="checklist-check-all-btn" type="button">Check all</button>
      <div class="items" id="items"></div>
      <button class="reset-btn" id="reset-btn" type="button">Reset today's checklist</button>
    </div>
  </div>
</div>

<script>
  const tasks = [
    { id: 'first-catch', label: 'First catch' },
    { id: 'first-spin', label: 'First spin' },
    { id: 'first-research', label: 'First research' },
    { id: 'send-gifts', label: 'Send gift' },
    { id: 'follow-route', label: 'Follow Routes' },
    { id: 'free-mega', label: 'Free Mega Evolve' },
    { id: 'special-trade', label: 'Special trade' },
    { id: 'buddy-hearts', label: 'Buddy Heart(s)' },
    { id: 'raid-boss', label: 'Raid boss' },
    { id: 'max-raid', label: 'Max Raid' },
    { id: 'daily-incense', label: 'Daily Incese' },
  ];

  const accountNames = [
    'ViictoriaZA',
    'Viibration',
    'ViisitorXY',
    'ViitaminEV',
    'ViineyardistEX',
    'ViizierSV',
    'ViiperGX',
    'ViillainousNX',
  ];

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  const STORAGE_KEY = 'pogo-daily-checklist';
  const today = todayKey();

  // Set by the Firebase module script below once signed in. When present,
  // saveState() also pushes to Realtime Database so the other device's
  // live listener picks up the change automatically.
  let currentUser = null;

  function emptyAccounts() {
    const accounts = {};
    accountNames.forEach(name => { accounts[name] = { done: {} }; });
    return accounts;
  }

  function loadState() {
    let stored;
    try {
      stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch {
      stored = {};
    }
    if (stored.date !== today || !stored.accounts) {
      stored = { date: today, accounts: emptyAccounts() };
      saveState(stored);
    }
    accountNames.forEach(name => {
      if (!stored.accounts[name]) stored.accounts[name] = { done: {} };
    });
    return stored;
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (currentUser && window.fbSetChecklist) {
      window.fbSetChecklist(currentUser.uid, state);
    }
  }

  let state = loadState();
  let currentAccount = null;

  const viewDashboard = document.getElementById('view-dashboard');
  const viewChecklist = document.getElementById('view-checklist');
  const dashboardDateLabelEl = document.getElementById('dashboard-date-label');
  const accountsEl = document.getElementById('accounts');
  const masterTasksEl = document.getElementById('master-tasks');

  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalTitleEl = document.getElementById('modal-title');
  const modalAccountsEl = document.getElementById('modal-accounts');
  const modalCloseBtn = document.getElementById('modal-close');
  const modalCheckAllBtn = document.getElementById('modal-check-all');
  let modalTaskId = null;

  const accountNameLabelEl = document.getElementById('account-name-label');
  const dateLabelEl = document.getElementById('date-label');
  const itemsEl = document.getElementById('items');
  const progressFillEl = document.getElementById('progress-fill');
  const progressLabelEl = document.getElementById('progress-label');
  const resetBtn = document.getElementById('reset-btn');
  const backBtn = document.getElementById('back-btn');
  const checklistCheckAllBtn = document.getElementById('checklist-check-all-btn');

  const dateStr = new Date().toLocaleDateString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric',
  });
  dashboardDateLabelEl.textContent = dateStr;
  dateLabelEl.textContent = dateStr;

  function countDone(name) {
    const done = state.accounts[name].done;
    return tasks.filter(t => done[t.id]).length;
  }

  function renderDashboard() {
    accountsEl.innerHTML = '';
    accountNames.forEach(name => {
      const doneCount = countDone(name);
      const total = tasks.length;
      const pct = total ? (doneCount / total) * 100 : 0;
      const complete = doneCount === total;

      const card = document.createElement('div');
      card.className = 'account-card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.innerHTML = `
        <div class="row">
          <span class="name">${name}</span>
          <span class="count${complete ? ' complete' : ''}">${doneCount} / ${total}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill${complete ? ' complete' : ''}" style="width: ${pct}%"></div>
        </div>
      `;
      card.addEventListener('click', () => openAccount(name));
      card.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          openAccount(name);
        }
      });
      accountsEl.appendChild(card);
    });

    renderMasterTasks();
  }

  function accountsDoneFor(taskId) {
    return accountNames.filter(name => !!state.accounts[name].done[taskId]);
  }

  function renderMasterTasks() {
    masterTasksEl.innerHTML = '';
    tasks.forEach(task => {
      const doneAccounts = accountsDoneFor(task.id);
      const total = accountNames.length;
      const complete = doneAccounts.length === total;
      const partial = doneAccounts.length > 0 && !complete;

      const row = document.createElement('div');
      row.className = 'task-row';
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.innerHTML = `
        <span class="label">${task.label}</span>
        <span class="badge${complete ? ' complete' : ''}${partial ? ' partial' : ''}">${doneAccounts.length} / ${total}</span>
      `;
      row.addEventListener('click', () => openModal(task.id));
      row.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          openModal(task.id);
        }
      });
      masterTasksEl.appendChild(row);
    });
  }

  function openModal(taskId) {
    modalTaskId = taskId;
    const task = tasks.find(t => t.id === taskId);
    modalTitleEl.textContent = task.label;
    renderModalAccounts();
    modalBackdrop.hidden = false;
  }

  function closeModal() {
    modalTaskId = null;
    modalBackdrop.hidden = true;
  }

  function renderModalAccounts() {
    modalAccountsEl.innerHTML = '';
    accountNames.forEach(name => {
      const done = !!state.accounts[name].done[modalTaskId];
      const row = document.createElement('div');
      row.className = 'modal-account-row' + (done ? ' done' : '');
      row.tabIndex = 0;
      row.setAttribute('role', 'checkbox');
      row.setAttribute('aria-checked', String(done));
      row.innerHTML = `
        <span class="box">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e1620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 12 10 18 20 6"></polyline>
          </svg>
        </span>
        <span class="name">${name}</span>
      `;
      row.addEventListener('click', () => toggleModalAccount(name));
      row.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          toggleModalAccount(name);
        }
      });
      modalAccountsEl.appendChild(row);
    });

    const allDone = accountNames.every(name => !!state.accounts[name].done[modalTaskId]);
    modalCheckAllBtn.textContent = allDone ? 'Uncheck all' : 'Check all';
  }

  function toggleModalAccount(name) {
    const done = state.accounts[name].done;
    done[modalTaskId] = !done[modalTaskId];
    saveState(state);
    renderModalAccounts();
    renderDashboard();
  }

  modalCheckAllBtn.addEventListener('click', () => {
    const allDone = accountNames.every(name => !!state.accounts[name].done[modalTaskId]);
    accountNames.forEach(name => {
      state.accounts[name].done[modalTaskId] = !allDone;
    });
    saveState(state);
    renderModalAccounts();
    renderDashboard();
  });

  modalCloseBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });

  // --- Bulk complete: mark every task done for one or more accounts ---
  const bulkOpenBtn = document.getElementById('bulk-open-btn');
  const bulkModalBackdrop = document.getElementById('bulk-modal-backdrop');
  const bulkModalCloseBtn = document.getElementById('bulk-modal-close');
  const bulkAccountsEl = document.getElementById('bulk-accounts');
  const bulkSelectAllBtn = document.getElementById('bulk-select-all-btn');
  const bulkApplyBtn = document.getElementById('bulk-apply-btn');
  const bulkUncheckBtn = document.getElementById('bulk-uncheck-btn');
  let bulkSelected = new Set();

  function openBulkModal() {
    bulkSelected = new Set();
    renderBulkAccounts();
    bulkModalBackdrop.hidden = false;
  }

  function closeBulkModal() {
    bulkModalBackdrop.hidden = true;
  }

  function renderBulkAccounts() {
    bulkAccountsEl.innerHTML = '';
    accountNames.forEach(name => {
      const selected = bulkSelected.has(name);
      const row = document.createElement('div');
      row.className = 'modal-account-row' + (selected ? ' done' : '');
      row.tabIndex = 0;
      row.setAttribute('role', 'checkbox');
      row.setAttribute('aria-checked', String(selected));
      row.innerHTML = `
        <span class="box">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e1620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 12 10 18 20 6"></polyline>
          </svg>
        </span>
        <span class="name">${name}</span>
      `;
      row.addEventListener('click', () => toggleBulkAccount(name));
      row.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          toggleBulkAccount(name);
        }
      });
      bulkAccountsEl.appendChild(row);
    });

    const allSelected = accountNames.every(name => bulkSelected.has(name));
    bulkSelectAllBtn.textContent = allSelected ? 'Deselect all accounts' : 'Select all accounts';
  }

  function toggleBulkAccount(name) {
    if (bulkSelected.has(name)) bulkSelected.delete(name);
    else bulkSelected.add(name);
    renderBulkAccounts();
  }

  bulkOpenBtn.addEventListener('click', openBulkModal);
  bulkModalCloseBtn.addEventListener('click', closeBulkModal);
  bulkModalBackdrop.addEventListener('click', (e) => {
    if (e.target === bulkModalBackdrop) closeBulkModal();
  });

  bulkSelectAllBtn.addEventListener('click', () => {
    const allSelected = accountNames.every(name => bulkSelected.has(name));
    if (allSelected) bulkSelected.clear();
    else accountNames.forEach(name => bulkSelected.add(name));
    renderBulkAccounts();
  });

  bulkApplyBtn.addEventListener('click', () => {
    if (bulkSelected.size === 0) return;
    bulkSelected.forEach(name => {
      tasks.forEach(t => { state.accounts[name].done[t.id] = true; });
    });
    saveState(state);
    renderDashboard();
    closeBulkModal();
  });

  bulkUncheckBtn.addEventListener('click', () => {
    if (bulkSelected.size === 0) return;
    bulkSelected.forEach(name => {
      tasks.forEach(t => { state.accounts[name].done[t.id] = false; });
    });
    saveState(state);
    renderDashboard();
    closeBulkModal();
  });

  // --- Manual device sync ---
  // Encodes the whole state blob (all accounts, today's date) as a
  // copy-pasteable code. Applying a code fully overwrites this device's
  // state with the other device's, so always copy from whichever device
  // has the most up-to-date checks.
  const syncBtn = document.getElementById('sync-btn');
  const syncModalBackdrop = document.getElementById('sync-modal-backdrop');
  const syncModalCloseBtn = document.getElementById('sync-modal-close');
  const syncExportBoxesEl = document.getElementById('sync-export-boxes');
  const syncCopyBtn = document.getElementById('sync-copy-btn');
  const syncImportBoxesEl = document.getElementById('sync-import-boxes');
  const syncApplyBtn = document.getElementById('sync-apply-btn');
  const syncPasteBtn = document.getElementById('sync-paste-btn');

  // Builds accountNames.length small <input> boxes separated by dashes,
  // one per account's mask. Returns the input elements in order.
  function buildSyncBoxes(container, { readonly }) {
    container.innerHTML = '';
    const boxes = [];
    accountNames.forEach((name, i) => {
      if (i > 0) {
        const dash = document.createElement('span');
        dash.className = 'sync-dash';
        dash.textContent = '-';
        container.appendChild(dash);
      }
      const box = document.createElement('input');
      box.type = 'text';
      box.className = 'sync-box';
      box.maxLength = 3;
      box.autocomplete = 'off';
      box.spellcheck = false;
      if (readonly) box.readOnly = true;
      container.appendChild(box);
      boxes.push(box);
    });
    return boxes;
  }

  const syncExportBoxes = buildSyncBoxes(syncExportBoxesEl, { readonly: true });
  const syncImportBoxes = buildSyncBoxes(syncImportBoxesEl, { readonly: false });

  // Fills every import box at once from a full "3-0-a1-0-0" code, instead
  // of needing it dumped into a single 3-char input. Returns true if the
  // text matched the expected shape.
  function fillImportBoxes(text) {
    const parts = text.trim().split('-');
    if (parts.length !== syncImportBoxes.length) return false;
    parts.forEach((p, i) => { syncImportBoxes[i].value = p.trim(); });
    syncImportBoxes[syncImportBoxes.length - 1].focus();
    return true;
  }

  syncImportBoxes.forEach(box => {
    box.addEventListener('paste', (e) => {
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (fillImportBoxes(text)) e.preventDefault();
    });
  });

  // One-tap paste from the OS clipboard instead of long-pressing a box
  // and using the browser's own paste menu.
  syncPasteBtn.addEventListener('click', async () => {
    let text;
    try {
      text = await navigator.clipboard.readText();
    } catch {
      alert("Couldn't read the clipboard automatically — long-press a box and paste manually instead.");
      return;
    }
    if (!fillImportBoxes(text)) {
      alert("Clipboard doesn't look like a valid code. Copy the full code from the other device first.");
    }
  });

  // Compact format instead of base64(JSON): since both devices run the
  // same app, accounts/tasks are known and fixed, so each account's 15
  // done-flags pack into one base36 bitmask. "20260725-0-1ff8-0-4-1"
  // instead of a few hundred characters of JSON.
  // No date in the code — applying a code always stamps it with this
  // device's "today", since sync is meant for same-day phone/PC use.
  function encodeState(s) {
    const masks = accountNames.map(name => {
      let mask = 0;
      const done = (s.accounts[name] && s.accounts[name].done) || {};
      tasks.forEach((t, i) => {
        if (done[t.id]) mask |= (1 << i);
      });
      return mask.toString(36);
    });
    return masks.join('-');
  }

  function decodeState(code) {
    const parts = code.trim().split('-');
    if (parts.length !== accountNames.length) throw new Error('bad code');

    const accounts = {};
    accountNames.forEach((name, idx) => {
      const mask = parseInt(parts[idx], 36);
      if (isNaN(mask)) throw new Error('bad code');
      const done = {};
      tasks.forEach((t, i) => {
        if (mask & (1 << i)) done[t.id] = true;
      });
      accounts[name] = { done };
    });
    return { date: today, accounts };
  }

  function openSyncModal() {
    const masks = encodeState(state).split('-');
    syncExportBoxes.forEach((box, i) => { box.value = masks[i]; });
    syncImportBoxes.forEach(box => { box.value = ''; });
    syncCopyBtn.textContent = 'Copy code';
    syncCopyBtn.classList.remove('copied');
    syncModalBackdrop.hidden = false;
  }

  function closeSyncModal() {
    syncModalBackdrop.hidden = true;
  }

  syncBtn.addEventListener('click', openSyncModal);
  syncModalCloseBtn.addEventListener('click', closeSyncModal);
  syncModalBackdrop.addEventListener('click', (e) => {
    if (e.target === syncModalBackdrop) closeSyncModal();
  });

  syncCopyBtn.addEventListener('click', async () => {
    const code = syncExportBoxes.map(box => box.value).join('-');
    try {
      await navigator.clipboard.writeText(code);
    } catch {
      const tempInput = document.createElement('textarea');
      tempInput.value = code;
      tempInput.style.position = 'fixed';
      tempInput.style.opacity = '0';
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
    }
    syncCopyBtn.textContent = 'Copied!';
    syncCopyBtn.classList.add('copied');
  });

  syncApplyBtn.addEventListener('click', () => {
    const code = syncImportBoxes.map(box => box.value.trim()).join('-');
    if (!code || code.replace(/-/g, '') === '') return;

    let imported;
    try {
      imported = decodeState(code);
    } catch {
      imported = null;
    }
    if (!imported || typeof imported !== 'object' || !imported.accounts) {
      alert("That code doesn't look right. Double-check you copied the whole thing.");
      return;
    }

    const ok = confirm("This will overwrite this device's checklist with the pasted data. Continue?");
    if (!ok) return;

    state = imported;
    saveState(state);
    renderDashboard();
    closeSyncModal();
  });

  function openAccount(name) {
    currentAccount = name;
    accountNameLabelEl.textContent = name;
    viewDashboard.hidden = true;
    viewChecklist.hidden = false;
    renderChecklist();
  }

  function closeAccount() {
    currentAccount = null;
    viewChecklist.hidden = true;
    viewDashboard.hidden = false;
    renderDashboard();
  }

  backBtn.addEventListener('click', closeAccount);

  function renderChecklist() {
    const done = state.accounts[currentAccount].done;

    itemsEl.innerHTML = '';
    tasks.forEach(task => {
      const isDone = !!done[task.id];
      const row = document.createElement('div');
      row.className = 'item' + (isDone ? ' done' : '');
      row.tabIndex = 0;
      row.setAttribute('role', 'checkbox');
      row.setAttribute('aria-checked', String(isDone));
      row.innerHTML = `
        <span class="box">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e1620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 12 10 18 20 6"></polyline>
          </svg>
        </span>
        <span class="label">${task.label}</span>
      `;
      row.addEventListener('click', () => toggle(task.id));
      row.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          toggle(task.id);
        }
      });
      itemsEl.appendChild(row);
    });

    const doneCount = countDone(currentAccount);
    const total = tasks.length;
    const pct = total ? (doneCount / total) * 100 : 0;
    const complete = doneCount === total;
    progressFillEl.style.width = `${pct}%`;
    progressFillEl.classList.toggle('complete', complete);
    progressLabelEl.textContent = `${doneCount} / ${total} done`;
    progressLabelEl.classList.toggle('complete', complete);
    checklistCheckAllBtn.textContent = complete ? 'Uncheck all' : 'Check all';
  }

  function toggle(id) {
    const done = state.accounts[currentAccount].done;
    done[id] = !done[id];
    saveState(state);
    renderChecklist();
  }

  checklistCheckAllBtn.addEventListener('click', () => {
    const done = state.accounts[currentAccount].done;
    const allDone = tasks.every(t => !!done[t.id]);
    tasks.forEach(t => { done[t.id] = !allDone; });
    saveState(state);
    renderChecklist();
  });

  resetBtn.addEventListener('click', () => {
    state.accounts[currentAccount] = { done: {} };
    saveState(state);
    renderChecklist();
  });

  // --- Firebase auto-sync (Google sign-in) ---
  // The module script below owns the actual Firebase SDK calls and drives
  // these two callbacks; this file just reacts to auth/data changes and
  // keeps pushing local edits back up via saveState() -> fbSetChecklist.
  const authBtn = document.getElementById('auth-btn');

  function updateAuthUI() {
    if (currentUser) {
      authBtn.textContent = '✅';
      authBtn.setAttribute('aria-label', 'Signed in — tap to sign out');
      authBtn.title = 'Signed in as ' + (currentUser.email || currentUser.displayName || 'Google account') + ' — tap to sign out';
    } else {
      authBtn.textContent = '👤';
      authBtn.setAttribute('aria-label', 'Sign in to sync automatically');
      authBtn.title = 'Sign in with Google to sync automatically';
    }
  }

  authBtn.addEventListener('click', () => {
    if (currentUser) {
      const ok = confirm('Sign out of automatic sync? Your data stays saved on this device either way.');
      if (ok && window.fbSignOut) window.fbSignOut();
    } else if (window.fbSignIn) {
      window.fbSignIn();
    }
  });

  window.onFirebaseUser = function (user) {
    currentUser = user;
    updateAuthUI();
  };

  window.onFirebaseChecklist = function (remote) {
    if (!remote || !remote.accounts) {
      // Nothing saved remotely yet for this account - seed it with
      // whatever this device already has.
      if (currentUser && window.fbSetChecklist) window.fbSetChecklist(currentUser.uid, state);
      return;
    }

    const wasStale = remote.date !== today;
    state = wasStale ? { date: today, accounts: emptyAccounts() } : remote;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    renderDashboard();
    if (currentAccount) renderChecklist();

    // If the remote copy was from a previous day, push the reset back up
    // so the other device follows instead of resurrecting old data.
    if (wasStale && currentUser && window.fbSetChecklist) {
      window.fbSetChecklist(currentUser.uid, state);
    }
  };

  renderDashboard();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('sw.js', { updateViaCache: 'none' })
        .then(reg => reg.update())
        .catch(() => {});
    });

    // sw.js calls skipWaiting()+clients.claim(), so once a new worker
    // activates, reload once to pick up the fresh assets instead of
    // requiring an uninstall/reinstall on mobile.
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  }
</script>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
  import {
    getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged,
  } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
  import {
    getDatabase, ref, set, onValue,
  } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js';

  const firebaseConfig = {
    apiKey: '__FIREBASE_API_KEY__',
    authDomain: 'pogo-daily-checklist.firebaseapp.com',
    databaseURL: 'https://pogo-daily-checklist-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'pogo-daily-checklist',
    storageBucket: 'pogo-daily-checklist.firebasestorage.app',
    messagingSenderId: '768881784379',
    appId: '1:768881784379:web:ef0caadfb54dab25f5ce1e',
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  // Popups don't reliably report back to an installed/standalone PWA
  // window (no dependable window.opener link in that display mode), so
  // sign-in uses a full-page redirect instead - navigates to Google and
  // back rather than opening a second window.
  window.fbSignIn = () => {
    signInWithRedirect(auth, provider);
  };

  window.fbSignOut = () => signOut(auth);

  window.fbSetChecklist = (uid, data) => {
    set(ref(db, 'checklist/' + uid), data).catch(() => {});
  };

  getRedirectResult(auth).catch((err) => {
    alert('Sign-in failed: ' + err.message);
  });

  let unsubscribeChecklist = null;

  onAuthStateChanged(auth, (user) => {
    if (unsubscribeChecklist) {
      unsubscribeChecklist();
      unsubscribeChecklist = null;
    }

    if (typeof window.onFirebaseUser === 'function') {
      window.onFirebaseUser(user);
    }

    if (user) {
      unsubscribeChecklist = onValue(ref(db, 'checklist/' + user.uid), (snapshot) => {
        if (typeof window.onFirebaseChecklist === 'function') {
          window.onFirebaseChecklist(snapshot.val());
        }
      });
    }
  });
</script>
